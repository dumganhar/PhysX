name: CI

on:
  push:
  pull_request:
#   release:
#     types: [published]

jobs:
  build-mac:
    name: "macOS"
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install xcpretty
      run: |
        sudo gem install xcpretty

    - name: Create Project
      run: |
        cd physx
        ./generate_projects.sh mac64
    - name: Build
      run: |
        cd physx/compiler/mac64
        xcodebuild -list -project PhysXSDK.xcodeproj
        xcodebuild ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO -scheme install -configuration release build | xcpretty && exit ${PIPESTATUS[0]}
    
    - name: Show Result
      run: |
        cd physx/compiler/mac64
        echo "Files in bin/mac.universal/release: "
        ls -l bin/mac.universal/release
        echo "Show lipo info: "
        ls bin/mac.universal/release/*.a | xargs lipo -info

